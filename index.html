<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Spritverbrauch Rechner</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #121212;
  color: #eee;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.container {
  background: #1e1e1e;
  padding: 20px;
  border-radius: 12px;
  width: 480px;
}
label { margin-top: 10px; display: block; }
input { width: 100%; padding: 8px; border-radius: 6px; border: none; margin-top: 4px; }
.row { display: flex; gap: 6px; }
.row input { flex: 1; }
button {
  margin-top: 15px;
  width: 100%;
  padding: 10px;
  background: #4caf50;
  border: none;
  border-radius: 6px;
  color: white;
  font-size: 16px;
}
.result { margin-top: 15px; background: #2a2a2a; padding: 10px; border-radius: 6px; }
.line {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #333;
  padding: 4px 0;
}
.bar {
  background: #333;
  border-radius: 6px;
  overflow: hidden;
  margin-top: 6px;
}
.bar-fill {
  background: #4caf50;
  height: 18px;
}
.small { font-size: 13px; opacity: 0.85; }
</style>
</head>

<body>
<div class="container">
<h1>Spritverbrauch-Rechner</h1>

<label>Rennlänge (Minuten)</label>
<input type="number" id="rennzeit">

<label>Rundenzeit</label>
<div class="row">
  <input type="number" id="rtMin" placeholder="Min">
  <input type="number" id="rtSec" placeholder="Sek">
</div>

<label>Verbrauch pro Runde (L)</label>
<input type="number" id="verbrauch" step="0.01">

<label>Tankvolumen (L)</label>
<input type="number" id="tank" step="0.1">

<button onclick="berechnen()">Berechnen</button>

<div class="result" id="out"></div>
</div>

<script>
function line(l, v) {
  return `<div class="line"><div>${l}:</div><div>${v}</div></div>`;
}

function berechnen() {
  const rennzeitEl = document.getElementById("rennzeit");
  const rtMinEl = document.getElementById("rtMin");
  const rtSecEl = document.getElementById("rtSec");
  const verbrauchEl = document.getElementById("verbrauch");
  const tankEl = document.getElementById("tank");
  const out = document.getElementById("out");

  const rennzeit = Number(rennzeitEl.value);
  const rundenzeit = (Number(rtMinEl.value) * 60) + Number(rtSecEl.value);
  const verbrauch = Number(verbrauchEl.value);
  const tank = Number(tankEl.value);

  if (!rennzeit || !rundenzeit || !verbrauch || !tank) {
    out.innerHTML = "Bitte alle Werte eingeben.";
    return;
  }

  const runden = Math.ceil((rennzeit * 60) / rundenzeit);
  const gesamt = runden * verbrauch;
  const stopps = Math.max(0, Math.ceil(gesamt / tank) - 1);
  const stints = stopps + 1;
  const rundenProStint = Math.floor(runden / stints);

  let html = "";
  html += line("Geschätzte Runden", runden);
  html += line("Boxenstopps", stopps);
  html += line("Runden pro Stint", rundenProStint);
  html += line("Gesamtverbrauch", `${gesamt.toFixed(2)} L`);

  if (stopps > 0) {
    html += `<div class="small"><br>📍 Boxenstopps:</div>`;
    for (let i = 1; i <= stopps; i++) {
      html += `<div class="small">→ nach Runde ${i * rundenProStint}</div>`;
    }
  }

  // Verbrauchsberechnung bei einer Runde mehr pro Stint mit gleichem Tank.
  const verbrauchNeuProRunde = tank / (rundenProStint + 1);
  const rundenNeu = stints * (rundenProStint + 1);
  const gesamtNeu = verbrauchNeuProRunde * rundenNeu;
  const verbrauchDifferenz = verbrauch - verbrauchNeuProRunde;

  html += `<br><div class="small">⛽ Tankstints:</div>`;
  for (let i = 1; i <= stints; i++) {
    const verbrauchStint = Math.min(tank, gesamt - tank * (i - 1));
    const percent = Math.min(100, (verbrauchStint / tank) * 100);
    html += `
      <div class="small">Stint ${i} (${verbrauchStint.toFixed(2)} L)</div>
      <div class="bar">
        <div class="bar-fill" style="width:${percent}%"></div>
      </div>`;
  }

  // Ausgabe der Verbrauchswerte
  html += `<br>`;
  html += line(`Verbrauch pro Runde bei ${runden} Runden`, `${verbrauch.toFixed(2)} L`);
  html += line(`Max. Verbrauch pro Runde bei ${rundenNeu} Runden (1 Runde mehr pro Stint)`, `${verbrauchNeuProRunde.toFixed(2)} L`);
  html += line(`Erforderliche Einsparung pro Runde`, `${verbrauchDifferenz.toFixed(2)} L`);
  html += line(`Gesamtverbrauch bei ${rundenNeu} Runden`, `${gesamtNeu.toFixed(2)} L`);

  out.innerHTML = html;
}
</script>
</body>
</html>
